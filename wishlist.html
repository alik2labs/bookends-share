<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>My Reading Wishlist · bookends</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#f5f5f0;--surface:#fff;--teal:#2a9d8f;--tp:#1a1a1a;--ts:#555;--tm:#888;--div:#e5e5e5;--r:14px}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--tp);min-height:100vh}
header{background:var(--surface);border-bottom:1px solid var(--div);padding:20px 20px 16px;text-align:center}
.app-name{font-size:13px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--teal);margin-bottom:6px}
h1{font-family:Georgia,serif;font-size:clamp(22px,5vw,30px);font-weight:normal;color:var(--tp)}
.subtitle{font-size:14px;color:var(--tm);margin-top:4px}
main{max-width:680px;margin:24px auto;padding:0 16px 60px}
.card{display:flex;gap:16px;background:var(--surface);border-radius:var(--r);padding:16px;margin-bottom:14px;box-shadow:0 2px 8px rgba(0,0,0,.06)}
.cover{flex-shrink:0;width:64px}
.cover img{width:64px;height:92px;object-fit:cover;border-radius:6px;box-shadow:0 2px 6px rgba(0,0,0,.15)}
.no-cover{width:64px;height:92px;background:#eee;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:28px}
.info{flex:1;min-width:0}
.title{font-size:15px;font-weight:700;color:var(--tp);line-height:1.35;margin-bottom:3px}
.author{font-size:13px;color:var(--ts);margin-bottom:3px}
.meta{font-size:12px;color:var(--tm);margin-bottom:4px}
.isbn{display:inline-block;font-size:11px;color:var(--tm);background:#f0f0ec;padding:2px 7px;border-radius:20px;margin-bottom:6px}
.synopsis{font-size:12px;color:var(--ts);line-height:1.55;margin-top:6px}
footer{text-align:center;font-size:12px;color:var(--tm);padding:20px}
footer a{color:var(--teal);text-decoration:none}
.loading{text-align:center;padding:60px 20px;color:var(--tm);font-size:15px}
.error-msg{text-align:center;padding:60px 20px;color:var(--tm)}
@media(prefers-color-scheme:dark){
  :root{--bg:#121212;--surface:#1e1e1e;--tp:#f0f0f0;--ts:#aaa;--tm:#666;--div:#2a2a2a}
  .isbn{background:#2a2a2a}.no-cover{background:#2a2a2a}
}
</style>
</head>
<body>
<header>
  <div class="app-name">bookends</div>
  <h1>My Reading Wishlist</h1>
  <div class="subtitle" id="subtitle">Loading…</div>
</header>
<main id="main"><div class="loading">Loading wishlist…</div></main>
<footer>Shared with <a href="https://apps.apple.com/app/bookends" target="_blank">bookends</a></footer>

<script>
function esc(s) {
  return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}

(async () => {
  const id = new URLSearchParams(location.search).get('id');
  if (!id) { showError('No wishlist ID provided.'); return; }

  try {
    const resp = await fetch('https://lheyncfekywjsvswwaws.supabase.co/functions/v1/wishlist/' + id);
    const data = await resp.json();
    if (data.error || !data.books) { showError('Wishlist not found.'); return; }

    const books = data.books;
    const count = books.length;
    const updatedAt = data.updated_at
      ? new Date(data.updated_at).toLocaleDateString('en-US', { year:'numeric', month:'long', day:'numeric' })
      : '';

    document.getElementById('subtitle').textContent =
      (count === 0 ? 'No books yet' : count + ' book' + (count === 1 ? '' : 's')) +
      (updatedAt ? ' · updated ' + updatedAt : '');

    document.getElementById('main').innerHTML = count === 0
      ? '<p style="text-align:center;color:var(--tm);padding:40px 0">No books in this wishlist yet.</p>'
      : books.map(b => {
          const cover = b.cover_url
            ? '<img src="' + esc(b.cover_url) + '" alt="Cover" onerror="this.style.display=\'none\'" loading="lazy">'
            : '<div class="no-cover">📚</div>';
          const year = b.published_year ? ' · ' + b.published_year : '';
          const pages = b.page_count ? ' · ' + b.page_count + ' pages' : '';
          const isbn = b.isbn13 || b.isbn;
          const isbnHtml = isbn ? '<span class="isbn">ISBN ' + esc(isbn) + '</span>' : '';
          const syn = (b.synopsis||'').slice(0,220) + ((b.synopsis||'').length > 220 ? '…' : '');
          const synHtml = syn ? '<p class="synopsis">' + esc(syn) + '</p>' : '';
          return '<div class="card"><div class="cover">' + cover + '</div><div class="info">' +
            '<div class="title">' + esc(b.title) + '</div>' +
            '<div class="author">' + esc(b.author) + '</div>' +
            '<div class="meta">' + esc(b.publisher||'') + year + pages + '</div>' +
            isbnHtml + synHtml + '</div></div>';
        }).join('');
  } catch(e) {
    showError('Could not load wishlist. Please try again.');
  }
})();

function showError(msg) {
  document.getElementById('subtitle').textContent = '';
  document.getElementById('main').innerHTML = '<div class="error-msg"><p>' + esc(msg) + '</p></div>';
}
</script>
</body>
</html>
